name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build Docker image
              run: docker build -t kali-scan-tools scan-tools/
            - name: Build Suricata image
              run: docker build -t suricata-ids defense/suricata/

    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Lint shell scripts
              run: shellcheck scan-tools/scripts/*.sh defense/suricata/*.sh

    scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build kali-scan-tools image
              run: docker build -t kali-scan-tools scan-tools/
            - name: Scan kali-scan-tools for vulnerabilities
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: kali-scan-tools
                  severity: CRITICAL,HIGH
                  exit-code: 0
            - name: Build suricata-ids image
              run: docker build -t suricata-ids defense/suricata/
            - name: Scan suricata-ids for vulnerabilities
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: suricata-ids
                  severity: CRITICAL,HIGH
                  exit-code: 0